name: Android Release CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Release Keystore
        id: keystore-cache
        uses: actions/cache@v4
        with:
          path: release.keystore
          key: android-release-keystore-static-v4

      - name: Generate Keystore if missing
        if: steps.keystore-cache.outputs.cache-hit != 'true'
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias staticReleaseKey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storetype PKCS12 \
            -storepass "StaticStorePassword123" \
            -keypass "StaticStorePassword123" \
            -dname "CN=Android Build, OU=CI, O=Project, L=City, S=State, C=US"

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Align and Sign APK
        run: |
          INPUT_APK=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          
          BUILD_TOOLS_DIR=$(ls -d ${ANDROID_HOME}/build-tools/* | tail -n 1)
          
          $BUILD_TOOLS_DIR/zipalign -v -p 4 "$INPUT_APK" aligned.apk
          
          $BUILD_TOOLS_DIR/apksigner sign \
            --ks release.keystore \
            --ks-pass pass:StaticStorePassword123 \
            --key-pass pass:StaticStorePassword123 \
            --ks-key-alias staticReleaseKey \
            --out app-release.apk \
            aligned.apk
            
          rm aligned.apk

      - name: Verify APK Signature
        run: |
          BUILD_TOOLS_DIR=$(ls -d ${ANDROID_HOME}/build-tools/* | tail -n 1)
          $BUILD_TOOLS_DIR/apksigner verify --verbose app-release.apk

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app-release.apk
