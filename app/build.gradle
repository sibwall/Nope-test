plugins {
    id 'com.android.application'
}

def isInnerBuild = project.hasProperty('isInner')

if (isInnerBuild) {
    buildDir = new File(project.projectDir, "build_inner")
}

android {
    namespace "duress.ultimate"
    compileSdk 34

    lint {
        checkReleaseBuilds false
    }

    defaultConfig {  
        applicationId "duress.ultimate"  
        minSdk 29
        targetSdk 37
        versionCode 17
        versionName "17.0"  
    }  

    buildTypes {  
        release {  
            minifyEnabled false  
            shrinkResources false  
        }  
    }

    sourceSets {
        main {
            if (isInnerBuild) {
                // Подменяем манифест
                manifest.srcFile 'src/main/AndroidManifest_inner.xml'
                // Перенаправляем исходники на временную папку, которую мы соберем сами
                java.srcDirs = ["${buildDir}/generated/inner_src"]
                // Убираем папку raw
                res.exclude 'raw/**' 
            } else {
                // Добавляем внутренний APK во внешнюю сборку
                res.srcDirs += "${buildDir}/generated/inner_res"
            }
        }
    }
}

dependencies {
}

// === ЛОГИКА ДЛЯ ВНУТРЕННЕЙ СБОРКИ ===
if (isInnerBuild) {
    // Задача, которая собирает нужные файлы вместе
    task prepareInnerSources {
        doLast {
            def targetDir = file("${buildDir}/generated/inner_src")
            // Очищаем папку от старых сборок
            targetDir.deleteDir()
            
            // 1. Копируем ВЕСЬ оригинальный код, КРОМЕ MainActivity
            copy {
                from 'src/main/java'
                exclude '**/MainActivity.java'
                into targetDir
            }
            
            // 2. Ищем измененный MainActivity ГДЕ УГОДНО в папке src/inner
            // и принудительно кладем его на место старого!
            copy {
                from fileTree(dir: 'src/inner', include: '**/MainActivity.java')
                // Вставляем ровно в тот же пакет, где он и должен быть
                into "${targetDir}/duress/ultimate" 
            }
            println "--> Исходники для внутреннего APK успешно подменены!"
        }
    }

    // Выполняем подмену файлов ДО того, как Gradle начнет что-либо анализировать
    tasks.named("preBuild").configure {
        dependsOn prepareInnerSources
    }
} 
// === ЛОГИКА ДЛЯ ОСНОВНОЙ СБОРКИ ===
else {
    task buildInnerApk(type: Exec) {
        group = "Build"
        workingDir project.rootDir 
        
        def isWindows = System.getProperty("os.name").toLowerCase().contains("windows")
        def gradlew = isWindows ? "gradlew.bat" : "./gradlew"
        
        commandLine gradlew, ":${project.name}:assembleRelease", "-PisInner=true"
        
        doLast {
            def innerApkPath = file("${project.projectDir}/build_inner/outputs/apk/release/app-release.apk")
            if (!innerApkPath.exists()) {
                innerApkPath = file("${project.projectDir}/build_inner/outputs/apk/release/app-release-unsigned.apk")
            }

            if (!innerApkPath.exists()) {
                throw new GradleException("Не удалось найти собранный внутренний APK: ${innerApkPath}")
            }
            
            def rawDir = file("${buildDir}/generated/inner_res/raw")
            rawDir.mkdirs()
            
            copy {
                from innerApkPath
                into rawDir
                rename { "base.apk" }
            }
            println "--> Внутренний APK успешно собран и помещен в ${rawDir}/base.apk"
        }
    }

    afterEvaluate {
        tasks.named("generateReleaseResources").configure {
            dependsOn buildInnerApk
        }
    }
}
