plugins {
    id 'com.android.application'
}

def isInnerBuild = project.hasProperty('isInner')

if (isInnerBuild) {
    buildDir = new File(project.projectDir, "build_inner")
}

android {
    namespace "duress.ultimate"
    compileSdk 34

    lint {
        checkReleaseBuilds false
    }

    defaultConfig {  
        applicationId "duress.ultimate"  
        minSdk 29
        targetSdk 37
        versionCode 17
        versionName "17.0"  
    }  

    buildTypes {  
        release {  
            minifyEnabled false  
            shrinkResources false  
        }  
    }

    sourceSets {
        main {
            if (isInnerBuild) {
                // 1. Для внутреннего APK берем другой манифест
                manifest.srcFile 'src/main/AndroidManifest_inner.xml'
                
                // 2. Исключаем MainActivity из сборки внутреннего APK
                java.exclude '**/MainActivity.java'
                
                // 3. Полностью исключаем папку raw для внутреннего APK
                res.exclude 'raw/**' 
            }
        }
    }
}

dependencies {
    // ваши зависимости
}

// === ЛОГИКА ТОЛЬКО ДЛЯ ОСНОВНОЙ СБОРКИ ===
if (!isInnerBuild) {
    task buildInnerApk(type: Exec) {
        group = "Build"
        workingDir project.rootDir 
        
        def isWindows = System.getProperty("os.name").toLowerCase().contains("windows")
        def gradlew = isWindows ? "gradlew.bat" : "./gradlew"
        
        commandLine gradlew, ":${project.name}:assembleRelease", "-PisInner=true"
        
        doLast {
            def innerApkPath = file("${project.projectDir}/build_inner/outputs/apk/release/app-release.apk")
            if (!innerApkPath.exists()) {
                innerApkPath = file("${project.projectDir}/build_inner/outputs/apk/release/app-release-unsigned.apk")
            }

            if (!innerApkPath.exists()) {
                throw new GradleException("Не удалось найти собранный внутренний APK: ${innerApkPath}")
            }
            
            // Копируем внутренний APK прямо поверх заглушки base.raw в src/main/res/raw/
            def rawFile = file("${project.projectDir}/src/main/res/raw/base.raw")
            if (!rawFile.parentFile.exists()) {
                rawFile.parentFile.mkdirs()
            }
            
            copy {
                from innerApkPath
                into rawFile.parentFile
                rename { "base.raw" }
            }
            println "--> Внутренний APK успешно собрался и перезаписал ${rawFile.absolutePath}"
        }
    }

    afterEvaluate {
        // Запускаем сборку внутреннего APK строго ДО слияния ресурсов основного APK
        tasks.named("mergeReleaseResources").configure {
            dependsOn buildInnerApk
        }
    }
}
