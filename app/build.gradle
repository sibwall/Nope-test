plugins {
    id 'com.android.application'
}

def isInnerBuild = project.hasProperty('isInner')

if (isInnerBuild) {
    // Изолируем папку билда внутреннего APK
    buildDir = new File(project.projectDir, "build_inner")
}

android {
    namespace "duress.ultimate"
    compileSdk 34

    lint {
        checkReleaseBuilds false
    }

    defaultConfig {  
        applicationId "duress.ultimate"  
        minSdk 29
        targetSdk 37
        versionCode 17
        versionName "17.0"  
    }  

    buildTypes {  
        release {  
            minifyEnabled false  
            shrinkResources false  
        }  
    }

    sourceSets {
        main {
            if (isInnerBuild) {
                // 1. Подменяем манифест для внутреннего APK
                manifest.srcFile 'src/main/AndroidManifest_inner.xml'
                
                // 2. Указываем собирать Java-код из нашей временной сгенерированной папки 
                // (перезаписывает стандартный src/main/java)
                java.srcDirs = ["${buildDir}/generated/inner_src"]
                
                // 3. Запрещаем включать папку raw из ресурсов
                res.exclude 'raw/**' 
            } else {
                // 4. Папка с внутренним base.apk добавляется ТОЛЬКО во внешнюю сборку
                res.srcDirs += "${buildDir}/generated/inner_res"
            }
        }
    }
}

dependencies {
    // ваши зависимости
}

// === ЛОГИКА ДЛЯ ВНУТРЕННЕЙ СБОРКИ ===
if (isInnerBuild) {
    // Создаем задачу, которая "собирает" исходники вместе перед компиляцией
    task prepareInnerSources(type: Copy) {
        // Берем весь оригинальный код, НО выкидываем оригинальный MainActivity
        from('src/main/java') {
            exclude '**/MainActivity.java'
        }
        // Накатываем поверх него измененный MainActivity из папки inner
        from('src/inner/java')
        
        // Складываем все это во временную папку
        into "${buildDir}/generated/inner_src"
    }

    // Говорим Gradle, что подготовку исходников нужно сделать ДО начала компиляции Java
    tasks.withType(JavaCompile).configureEach {
        dependsOn prepareInnerSources
    }
} 
// === ЛОГИКА ДЛЯ ОСНОВНОЙ СБОРКИ ===
else {
    task buildInnerApk(type: Exec) {
        group = "Build"
        workingDir project.rootDir 
        
        def isWindows = System.getProperty("os.name").toLowerCase().contains("windows")
        def gradlew = isWindows ? "gradlew.bat" : "./gradlew"
        
        // Запускаем дочернюю сборку
        commandLine gradlew, ":${project.name}:assembleRelease", "-PisInner=true"
        
        doLast {
            def innerApkPath = file("${project.projectDir}/build_inner/outputs/apk/release/app-release.apk")
            if (!innerApkPath.exists()) {
                innerApkPath = file("${project.projectDir}/build_inner/outputs/apk/release/app-release-unsigned.apk")
            }

            if (!innerApkPath.exists()) {
                throw new GradleException("Не удалось найти собранный внутренний APK: ${innerApkPath}")
            }
            
            def rawDir = file("${buildDir}/generated/inner_res/raw")
            rawDir.mkdirs()
            
            copy {
                from innerApkPath
                into rawDir
                rename { "base.apk" }
            }
            println "--> Внутренний APK успешно собран и помещен в ${rawDir}/base.apk"
        }
    }

    afterEvaluate {
        tasks.named("generateReleaseResources").configure {
            dependsOn buildInnerApk
        }
    }
}
